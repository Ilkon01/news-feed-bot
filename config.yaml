# ---------- ШАГ 3: ДЕДУПЛИКАЦИЯ ----------
# Насколько похожими должны быть заголовки, чтобы считаться одной новостью.
# Меньше — строже склеивает (риск потерять разные новости),
# больше — мягче (риск дублей).
duplicate_threshold: 0.4

# Сколько часов помнить отправленные новости
duplicate_memory_hours: 72

# ---------- ХЕШТЕГИ ----------
show_hashtags: false

# ---------- ШАГ 4: ИНТЕРЕСЫ (из опросника от 21.09.2026) ----------
# Разделы с уровнями интереса. У каждого раздела свой эмодзи —
# он ставится перед заголовком новости.
# Уровни:
#   очень_интересно — присылать регулярно
#   интересно       — присылать, когда есть заметное событие
#   средний_интерес — только значимые новости
#   слабый_интерес  — только очень крупные события
# Темы «Не присылать» — в разделе never_send ниже.
topics:
  "Казахстан: власть и политика":
    emoji: "🇰🇿"
    интересно:
      - "Борьба с коррупцией, дела против чиновников"
      - "Отношения Казахстана с США и Европой"
    средний_интерес:
      - "Решения Президента и Администрации Президента"
      - "Работа Правительства, отставки и назначения министров"
      - "Политические реформы, выборы, референдумы"
      - "Акимы и местная власть"
      - "Госбюджет и Национальный фонд: куда идут деньги"
      - "Отношения Казахстана с Россией"
      - "Отношения Казахстана с Китаем"
      - "Права человека, свобода слова, НКО"
      - "Оппозиция и гражданские активисты"
      - "Госуслуги, eGov, цифровизация государства"
    слабый_интерес:
      - "Парламент: Мажилис, Сенат, новые законы"
      - "Внешняя политика Казахстана: визиты, договоры"

  "Казахстан: экономика и кошелёк":
    emoji: "💰"
    интересно:
      - "Курс тенге и прогнозы"
      - "Цены на бензин, коммунальные тарифы"
      - "Иностранные инвестиции и крупные проекты"
    средний_интерес:
      - "Зарплаты, пенсии, пособия"
      - "Кредиты, ипотека, новости банков"
