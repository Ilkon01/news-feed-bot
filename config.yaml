breaking_news: true

# ---------- О ЧИТАТЕЛЕ ----------
# ИИ учитывает это, решая, что прислать и как написать.
reader_profile:
  - "Возраст 25–34, живёт в Казахстане."
  - "Хадж и умра — профессионально важная тема."
  - "Читает по-русски и по-казахски, дайджест нужен на русском."
  - "В инвестициях только начинает."
  - "Баланс новостей: примерно 30% о Казахстане и 70% о мире."

# ---------- ПРАВИЛА ОТБОРА ----------
# Что присылать, а что нет. Пишите обычными словами.
editorial_rules:
  - "Войны и вооружённые конфликты: присылай только главное — начало и окончание боевых действий, крупные удары с большим числом жертв, заметные изменения на фронте, перемирия, переговоры, решения лидеров. Не присылай рядовые сводки об отдельных обстрелах, если ничего не изменилось."
  - "Криминал, катастрофы и трагедии: как можно меньше. Присылай только крупные события, о которых говорит весь мир или весь Казахстан."
  - "По темам образования, саморазвития, навыков, лайфхаков, историй успеха и науки можно присылать полезные материалы и без срочного события: результаты исследований, заметные книги, практические находки — если это содержательно и от серьёзного издания."
  - "Аналитику и разборы присылай, если они по темам уровня «очень интересно» или «интересно» и содержат конкретные факты, а не только мнения."
  - "Прогнозы и сценарии «что будет, если» присылай только от авторитетных источников и только по темам уровня «очень интересно»."
  - "Заявление политика без действий присылай, только если это крупная фигура: глава государства, министр, глава центробанка или международной организации."
  - "Не присылай новости, которые лишь пересказывают чужую публикацию, не добавляя фактов."
  - "Не присылай рекламные и промо-материалы, подборки скидок, обзоры товаров ради продажи."

# ---------- ПРАВИЛА НАПИСАНИЯ ----------
# Как писать текст новости.
writing_rules:
  - "В экономических и финансовых новостях поясняй термины простыми словами — одной короткой фразой в подробностях. Например: «ставка ФРС — это процент, под который банки США берут деньги; от неё зависит курс доллара»."
  - "В новостях о войнах и конфликтах не описывай тактические подробности и натуралистичные детали — только суть: что произошло, итог, значение."
  - "В новостях о преступлениях, катастрофах и трагедиях — без натуралистичных подробностей о жертвах и травмах."

never_send:
  - "материалы, продвигающие салафизм или религиозный экстремизм"
  - "реклама и промо-материалы"
  - "криминальная хроника местного значения"
  - "аниме, комиксы, поп-культура"
  - "юмор и мемы"

# ---------- ЗАБЛОКИРОВАННЫЕ ИЗДАНИЯ ----------
# Домен, часть домена, доменная зона (начиная с точки) или название.
