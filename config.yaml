# =========================================================
# КОНФИГ БОТА. Меняйте только этот файл.
# Версия 2.1 — публичный репозиторий, 5 новостей каждые 30 минут.
#
# ВНИМАНИЕ: репозиторий ПУБЛИЧНЫЙ, этот файл видит любой.
# Никогда не вписывайте сюда токены, ключи, chat_id, имена,
# телефоны и любые личные данные. Всё секретное — только в
# Settings → Secrets and variables → Actions.
# =========================================================
#
# У каждого источника есть trust — рейтинг доверия от 1 до 10.
# Когда одна и та же новость приходит из нескольких источников, бот
# берёт её от источника с самым высоким trust, у которого удалось
# получить полный текст статьи. Если у самого надёжного текст закрыт
# (платная подписка, защита от ботов), берётся следующий по доверию.
#
# Дополнительные пометки у источника:
#   kz: true             — казахстанское издание (для баланса 30/70)
#   skip_keywords: true  — тематическая лента (наука, здоровье, стартапы):
#                          все её новости идут к ИИ без отсева по словам
#   aggregate: true      — лента Google News, настоящий издатель
#                          берётся из самой записи
# =========================================================

