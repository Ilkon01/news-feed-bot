# ---------- СТРОГИЕ ДОМЕНЫ И ИСТОЧНИКИ ----------
# Для них ИИ пропускает только конкретные свершившиеся факты,
# без аналитики, колонок и прогнозов.
strict_domains:
  - .kg
  - 24.kg
  - kaktus.media
  - akipress
  - kloop.kg
  - vb.kg
  - sputnik.kg
strict_sources:
  - "France 24"

# ---------- ТЕКСТ СТАТЬИ ----------
# Бот заходит на страницу статьи и берёт полный текст — без этого
# ИИ не из чего делать подробный конспект. Если описание в ленте
# короче этого числа знаков, идём за полным текстом. 1500 — значит
# почти всегда: ленты редко дают больше пары абзацев.
fetch_full_text: true
min_description_chars: 1500

# Сколько источников одного сюжета перебирать в поисках открытого
# текста. Больше — чаще найдётся полный текст, но запуск дольше.
max_text_attempts: 3

# ---------- ФОРМАТ СООБЩЕНИЯ ----------
#   Уровень 1 — заголовок: суть события
#   Уровень 2 — текст под заголовком: где, когда, кто, почему
#   Уровень 3 — раскрывающийся блок: полный конспект статьи
#   Уровень 4 — подпись: источник (он же ссылка) · страна
#
# Длины подобраны под экран телефона (в строке около 26 знаков):
#   заголовок жирным: 45 знаков ≈ 2 строки
#   текст: 75 знаков = 3 строки, 100 = 4 строки, 125 = 5 строк
title_max_chars: 45
lead_max_chars: 125
detail_length: "6–12 предложений, разбитых на 2–3 коротких абзаца"

# ---------- ВРЕМЯ ----------
# Часовой пояс Казахстана относительно Гринвича
utc_offset: 5

# Тихие часы: в это время новости не приходят (по местному времени).
# Расписание в .github/workflows/news-bot.yml и так не запускает бота
# ночью, а эта настройка страхует от запусков, которые GitHub
# выполнил с опозданием.
quiet_hours:
  from: 0
  to: 5

# ---------- ПОГОДА ----------
# Короткий пост с прогнозом раз в день утром.
# Приходит с первым запуском бота после указанного часа
# (запуски в 05:07, 05:37, 06:07... — при 7 придёт около 07:07).
weather:
  enabled: true
  city: "Алматы"
  latitude: 43.2389
  longitude: 76.8897
  post_after_hour: 7
  post_before_hour: 12

# ---------- ЛИМИТЫ ----------
# Бот запускается каждые 30 минут и присылает до max_per_run новостей.
# 5 за запуск = 20 новостей за 2 часа.
# Новости, до которых очередь не дошла, не теряются — они уйдут
# в следующих запусках, пока не устареют (max_age_hours).
#
# Обращений к ИИ за запуск — потолок, а не цель. Бот останавливается,
# как только набрал max_per_run новостей. Запас нужен на случай,
# если ИИ отклонит часть новостей.
max_ai_calls_per_run: 15
# Минимальный промежуток между обращениями к ИИ в секундах.
# Если само обращение шло дольше — бот не ждёт дополнительно.
seconds_between_ai_calls: 4.5
# Максимум новостей за один запуск
max_per_run: 5
